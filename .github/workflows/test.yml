name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    # A real Stackurity server (the public image) on the runner, with feeds off,
    # so the action's download, signature check and upload are exercised.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start a Stackurity server
        id: server
        run: |
          set -euo pipefail
          docker network create stk
          docker run -d --name pg --network stk -e POSTGRES_USER=stackurity -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=stackurity postgres:17-alpine
          DB='postgres://stackurity:pw@pg:5432/stackurity?sslmode=disable'
          docker run -d --name stk --network stk -p 8080:8080 -e STACKURITY_DATABASE_URL="$DB" -e STACKURITY_FEEDS=off -e STACKURITY_UPDATE_CHECK=off ghcr.io/stackurity/stackurity:latest
          for i in $(seq 1 60); do curl -fs http://localhost:8080/readyz && break; sleep 2; done
          TOKEN=$(docker exec -e STACKURITY_DATABASE_URL="$DB" stk stackurity admin create-token --name ci | tail -1)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Scan without a gate
        id: scan
        uses: ./
        with:
          server: http://localhost:8080
          token: ${{ steps.server.outputs.token }}
          path: test/sample
          git-url: https://example.com/scan-action-sample
      - name: Scan with a gate (no feeds, so nothing can fail it)
        uses: ./
        with:
          server: http://localhost:8080
          token: ${{ steps.server.outputs.token }}
          path: test/sample
          git-url: https://example.com/scan-action-sample
          fail-on: critical
          version: ${{ steps.scan.outputs.version }}
      - name: The asset exists on the server
        run: |
          docker exec -e STACKURITY_DATABASE_URL='postgres://stackurity:pw@pg:5432/stackurity?sslmode=disable' stk stackurity admin list-workspaces | tee /dev/stderr | grep -q "1 assets"

  download:
    # Download and verification on every runner OS (no server).
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run against a server that is not there
        id: run
        continue-on-error: true
        uses: ./
        with:
          server: http://127.0.0.1:9
          token: none
          wait: 5s
      - name: The binary was downloaded and verified
        shell: bash
        run: |
          set -euo pipefail
          stackurity --version
